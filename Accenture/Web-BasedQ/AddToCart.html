<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: #333;
        }

        h2 {
            margin-top: 40px;
        }

        table {
            border-collapse: collapse;
            width: 70%;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #0056b3;
            padding: 12px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #003d80;
        }
    </style>
</head>

<body>

    <h1>Shopping Cart</h1>
    <table id="itemsTable">

        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Chips</td>
                <td>2</td>
                <td>
                    <button id="addToCartChips">
                        Add to Cart
                    </button>
                </td>
            </tr>

            <tr>
                <td>Soda</td>
                <td>1.5</td>
                <td>
                    <button id="addToCartSoda">
                        Add to Cart
                    </button>
                </td>
            </tr>

            <tr>
                <td>Cookies</td>
                <td>3</td>
                <td>
                    <button id="addToCartCookies">
                        Add to Cart
                    </button>
                </td>
            </tr>

        </tbody>

    </table>


    <h2>Shopping Cart</h2>

    <table id="cartTable">

        <thead>
            <tr>
                <th>Item</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody>

            <tr>
                <td>Chips</td>
                <td id="quantityChips">0</td>
            </tr>

            <tr>
                <td>Soda</td>
                <td id="quantitySoda">0</td>
            </tr>

            <tr>
                <td>Cookies</td>
                <td id="quantityCookies">0</td>
            </tr>

        </tbody>

    </table>


    <script>

        // Initial quantities

        let chips = 0;
        let soda = 0;
        let cookies = 0;


        // Chips button

        document
            .getElementById("addToCartChips")
            .addEventListener("click", () => {

                chips++;

                document
                    .getElementById("quantityChips")
                    .innerText = chips;

            });


        // Soda button

        document
            .getElementById("addToCartSoda")
            .addEventListener("click", () => {

                soda++;

                document
                    .getElementById("quantitySoda")
                    .innerText = soda;

            });


        // Cookies button

        document
            .getElementById("addToCartCookies")
            .addEventListener("click", () => {

                cookies++;

                document
                    .getElementById("quantityCookies")
                    .innerText = cookies;

            });

    </script>

</body>

</html>
