<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CHECK Password Match or Not</title>
</head>
<body>
    <input type="password" id="password" placeholder="Enter Password"><br><br>
    <input type="password" id="confimedPassword" placeholder="Confimed Password">
    <p id="message"></p>
    <!-- <button onclick="checkPassword()">Submit</button> -->

    <script>

        const password = document.getElementById("password");
        const CP = document.getElementById("confimedPassword");
        const message = document.getElementById("message");

        function checkPassword(){
            if(password.value.length >= 8 && password.value === CP.value){
                message.textContent = "password Match";
                message.style.color = "green";
                 
            } 
         else {

        message.textContent = "Passwords do not match or too short";
        message.style.color = "red";
    }           
        }

        password.addEventListener("input",checkPassword);
        CP.addEventListener("input",checkPassword);

    </script>


</body>
</html>
